<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laudo de OCT de Mácula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mesmo sistema visual dos laudos de Mapeamento e Ultrassom: formulário por olho | laudo ao vivo. OD = tom quente, OE = azul. */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --ink:#15202A; --muted:#5A6773; --line:#D8DEE3;
  --od:#B0461F; --od-soft:#F6E3DA; --oe:#21608C; --oe-soft:#DCE8F1;
  --warn:#C0262D;
  --accent:var(--od); --accent-soft:var(--od-soft);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-label:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --surface:#161E25; --ink:#E3E9ED; --muted:#93A0AB; --line:#2A3540;
  --od:#E5835A; --od-soft:#3A241B; --oe:#74AEDB; --oe-soft:#182B3A; --warn:#F0676C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#161E25; --ink:#E3E9ED; --muted:#93A0AB; --line:#2A3540;
  --od:#E5835A; --od-soft:#3A241B; --oe:#74AEDB; --oe-soft:#182B3A; --warn:#F0676C; color-scheme:dark }
[data-eye="OE"]{ --accent:var(--oe); --accent-soft:var(--oe-soft) }

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto}
header.top{padding-block:20px 8px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--f-label);font-weight:600;font-size:1.5rem;letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.back{color:var(--muted);font-size:.85rem;text-decoration:none}
.back:hover{color:var(--accent)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

.label{font-family:var(--f-label);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.tech{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.grow{flex:1 1 220px}
.field input[type=text],.field textarea,select,.numin{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.numin{width:110px;font-family:var(--f-mono)}
.field textarea{resize:vertical;min-height:58px;width:100%}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.unit{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

.eyebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;font-family:var(--f-label);font-weight:600;font-size:.95rem;letter-spacing:.04em;cursor:pointer;display:flex;gap:8px;align-items:center}
.seg button[aria-pressed="true"][data-e="OD"]{background:var(--od);color:#fff}
.seg button[aria-pressed="true"][data-e="OE"]{background:var(--oe);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"][data-e]{color:#0E1317}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"][data-e]{color:#0E1317}}
.count{font-family:var(--f-mono);font-size:.75rem;font-weight:500;min-width:20px;padding:0 5px;border-radius:9px;border:1px solid currentColor;opacity:.85;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 11px;font-size:.85rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.warn{color:var(--warn);border-color:var(--warn)}

.sections{display:flex;flex-direction:column;gap:12px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h h2{font-family:var(--f-label);font-weight:600;font-size:1rem;margin:0;letter-spacing:.02em}
.pill{font-family:var(--f-label);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:20px;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.abn{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:18px;background:var(--bg);max-width:100%}
.chip button{border:0;background:none;padding:5px 11px;font-size:.85rem;cursor:pointer;text-align:left}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip.on button{color:var(--accent);font-weight:500}
.chip.mini{background:var(--surface)}
.chip.mini button{padding:4px 10px;font-size:.82rem}
.outro{width:100%;background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:7px 9px;font-size:.88rem}
.outro:focus{border-style:solid}
.qrow{display:flex;flex-direction:column;gap:8px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.qline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.qline select{max-width:100%}
.fovrow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start}

/* Imagens do exame */
.drop{display:flex;flex-direction:column;gap:10px}
.dz{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:.88rem;cursor:pointer;background:var(--bg)}
.dz.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.th{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;aspect-ratio:4/3}
.ai{display:flex;flex-direction:column;gap:8px;padding-top:2px}
.ai .copy:disabled{opacity:.65;cursor:progress}
.hint.bad{color:var(--warn)}
.notes{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:8px 10px}
.ana summary{cursor:pointer}
.ana[open] summary{margin-bottom:2px}
.notes ul{margin:4px 0 0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:2px}
.th .err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;color:#E3E9ED;font-size:.8rem}
.th img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.th .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1;font-size:15px}
.lb{position:fixed;inset:0;z-index:30;background:rgba(5,8,10,.94);display:flex;flex-direction:column}
.lb-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;color:#E3E9ED}
.lb-h .btn{background:#161E25;border-color:#2A3540;color:#E3E9ED}
.lb-b{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom pan-x pan-y}
.lb-b img{max-width:100%;max-height:100%;cursor:zoom-in}
.lb-b.full{align-items:flex-start;justify-content:flex-start}
.lb-b.full img{max-width:none;max-height:none;cursor:zoom-out}

.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
@media (max-width:900px){.preview{position:static;max-height:none}}
.prev-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.copy{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .copy{color:#0E1317}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .copy{color:#0E1317}}
/* Laudo como folha: sempre fundo branco, Arial 12 justificado */
#out{margin:0;padding:18px 18px 22px;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:12pt;line-height:1.4;text-align:justify;hyphens:none;overflow:auto;flex:1;min-width:0;overflow-wrap:break-word}
#out p{margin:0}
#out:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.mode{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.mode.on{background:var(--accent-soft);color:var(--accent)}
.mode .btn{padding:4px 9px;font-size:.8rem}
.foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:6px;align-items:center;font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

.mbar{display:none}
@media (max-width:900px){.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}
@media (pointer:coarse){input,select,textarea,.outro,.numin,.field input,.field textarea{font-size:16px!important}}
.mbar .actions{flex-wrap:nowrap}
.mbar .label{white-space:nowrap}
.credit{max-width:1180px;margin:28px auto 8px;text-align:center;font-family:var(--f-label);font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:.88rem;z-index:40}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:border-color .15s,background .15s}}

#printImgs{display:none}
@media print{
  body{background:#fff;padding:0}
  .wrap > header, main, .prev-h, .foot, .mbar, .toast, .credit, .lb{display:none!important}
  .grid{display:block}
  .preview{border:0;position:static;max-height:none}
  #out{padding:0;overflow:visible}
  .mode{display:none!important}
  #printImgs.on{display:block;font-family:Arial,Helvetica,sans-serif;font-size:12pt;color:#000;break-before:page}
  #printImgs h3{font-size:12pt;margin:0 0 8px}
  #printImgs img{display:block;max-width:100%;max-height:11cm;margin:0 auto 10px;break-inside:avoid}
  @page{margin:2cm}
}
</style>
</head>
<body>

<div class="wrap" id="app" data-eye="OD">
  <header class="top">
    <h1>Laudo de OCT de Mácula</h1>
    <p class="sub">Sem seleção, a estrutura sai normal. O laudo ao lado pode ser editado direto antes de copiar. <a class="back" href="index.html">‹ Modelos</a></p>
  </header>

  <div class="grid">
    <main>
      <section class="tech" aria-label="Dados do exame">
        <div class="field"><label class="label" for="pac">Paciente</label><input type="text" id="pac" placeholder="Nome do paciente" autocomplete="off"></div>
        <div class="row">
          <div class="field"><label class="label" for="data">Data do exame (opcional)</label><input type="text" id="data" inputmode="numeric" placeholder="dd/mm/aaaa" autocomplete="off"></div>
          <div class="field"><label class="label" for="olhos">Olhos examinados</label><select id="olhos"><option value="AO">Ambos</option><option value="OD">Só olho direito</option><option value="OE">Só olho esquerdo</option></select></div>
        </div>
      </section>

      <div class="eyebar">
        <div class="seg" role="group" aria-label="Olho em edição" id="eyeseg">
          <button type="button" data-e="OD" aria-pressed="true">OD <span class="count" id="cOD">0</span></button>
          <button type="button" data-e="OE" aria-pressed="false">OE <span class="count" id="cOE">0</span></button>
        </div>
        <div class="actions">
          <button class="btn" id="copyEye">Copiar para OE</button>
          <button class="btn" id="normEye">Olho normal</button>
          <button class="btn" id="resetAll">Novo laudo</button>
        </div>
      </div>

      <div class="sections" id="sections"></div>
    </main>

    <aside class="preview" aria-label="Laudo gerado">
      <div class="prev-h"><span class="label">Laudo</span>
        <div class="actions"><button class="btn" id="printBtn">Imprimir</button><button class="btn" id="copyPlain">Copiar texto simples</button><button class="copy" id="copyTop">Copiar laudo</button></div></div>
      <div class="mode" id="mode"><span id="modeTxt"></span><button class="btn" type="button" id="modeBack" hidden>Voltar ao formulário</button></div>
      <div id="out" contenteditable="true" spellcheck="true" lang="pt-BR" role="textbox" aria-multiline="true" aria-label="Laudo (editável)"></div>
      <div class="foot" id="aiNotes" hidden></div>
      <div class="foot">
        <div class="field"><label class="label" for="cterm">Início da conclusão automática</label><select id="cterm"><option value="compatível com">Exame compatível com…</option><option value="sugestivo de">Exame sugestivo de…</option></select></div>
        <label class="check"><input type="checkbox" id="printImg"> Incluir as imagens na impressão</label>
        <div class="field"><label class="label" for="enc">Texto de encerramento (fica salvo neste navegador)</label><textarea id="enc" rows="3"></textarea></div>
        <div class="field"><label class="label" for="ass">Assinatura, uma linha por item (fica salva neste navegador)</label><textarea id="ass" rows="3" placeholder="NOME SOBRENOME&#10;CRMBA 00000 / RQE 00000&#10;OFTALMOLOGISTA"></textarea></div>
      </div>
      <div id="printImgs"></div>
    </aside>
  </div>

</div>

<footer class="credit">Desenvolvido por RJFR</footer>

<div class="mbar"><span class="label" id="mstat">OD · OE</span><div class="actions"><button class="btn" id="seeBot">Ver laudo</button><button class="copy" id="copyBot">Copiar laudo</button></div></div>
<div class="toast" id="toast" hidden></div>

<div class="lb" id="lb" hidden role="dialog" aria-label="Imagem ampliada">
  <div class="lb-h"><span class="label" id="lbCap" style="color:#93A0AB"></span>
    <div class="actions"><button class="btn" id="lbPrev">‹</button><button class="btn" id="lbNext">›</button><button class="btn" id="lbZoom">Tamanho real</button><button class="btn" id="lbClose">Fechar</button></div></div>
  <div class="lb-b" id="lbB"><img id="lbImg" alt=""></div>
</div>

<script>
/* Catálogo de achados, com as frases dos laudos do serviço (guia-laudo-oct.md).
   t = frase do item; c = termo da conclusão (null = não entra); cg = conclusão por opção do seletor
   g = seletor [rótulo, inserção em t, inserção em c]; s = complementos [chave, rótulo, texto em t, texto em c]
   n = medida em µm ({n} marca o ponto); sec2 = só entra na conclusão se não houver achado principal no olho
   alone = frase quando é o único achado da interface; hial = estado da hialoide (une-se ao seguinte com "com")
   own = item próprio após a interface; take = substitui itens ('all' todos, '2-6', '4-6', '5-6'); m56 = ocupa os itens 5 e 6 */
const IVR='Interface vítreo-retiniana: ';
const SECTIONS = [
 {id:'ivr', name:'Interface vítreo-retiniana', normal:'Interface vítreo-retiniana: Sem alterações', f:[
  {id:'hpar', l:'Hialoide parcialmente aderida', hial:1, t:'hialoide posterior parcialmente aderida', c:null},
  {id:'hade', l:'Hialoide aderida', hial:1, t:'hialoide aderida', alone:'Sem alterações com hialoide aderida', c:null},
  {id:'hdes', l:'Hialoide descolada', hial:1, t:'hialoide posterior descolada', c:null},
  {id:'hnv', l:'Não visualizo hialoide', hial:1, t:'Não visualizo hialoide posterior', c:null},
  {id:'mer', l:'Membrana epirretiniana', t:'Hiperrefletividade linear pré retiniana{g} compatível com membrana epirretiniana', c:'membrana epirretiniana',
   g:[['Padrão','',''],['Discreta',' discreta',''],['Tênue',' tênue','']]},
  {id:'vmt', l:'Tração vitreomacular', t:'adesão vítrea persistente na região macular, com tração sobre a superfície retiniana e alteração do contorno foveal{g}', c:'tração vitreomacular{g}',
   g:[['Extensão não especificada','',''],['Focal (≤ 1500 µm)',', de configuração focal (extensão da adesão ≤ 1500 µm)',' focal'],['Ampla (> 1500 µm)',', de configuração ampla (extensão da adesão > 1500 µm)',' ampla']]},
  {id:'hsh', l:'Hemorragia sub-hialoidea', t:'Presença de pontos hiperrefletivos entre a hialoide e a retina sugestivo de hemorragia subhialoidea', c:null},
  {id:'oleo', l:'Óleo de silicone', t:'linha hiperrefletiva sugestiva de óleo de silicone em cavidade vítrea', c:null},
  {id:'phm', l:'Pseudoburaco macular', t:'Hiperrefletividade linear pré retiniana compatível com membrana epirretiniana, com bordas foveais verticalizadas, compatível com pseudoburaco macular', c:'pseudoburaco macular'},
  {id:'lmh', l:'Buraco macular lamelar', own:1, t:'Presença de defeito parcial da retina interna foveal, com bordas solapadas e retina externa preservada, compatível com buraco macular lamelar', c:'buraco macular lamelar'},
  {id:'bm', l:'Buraco macular de espessura total', own:1, take:'2-6', t:'Presença de buraco macular de espessura total, com descontinuidade completa da retina neurossensorial na fóvea{n}', c:'buraco macular de espessura total',
   n:{l:'Diâmetro', t:' medindo cerca de {n} µm', c:()=>''},
   s:[['cis','Bordos com cistos','. Bordos do buraco apresentam cistos intrarretinianos com bordos elevados','']], sp:'', scp:''},
  {id:'trd', l:'Descolamento tracional', own:1, take:'all', t:'Hialoide aderida com tração vítreo retiniana em vários pontos causando perda da depressão foveal e desorganização completa das camadas retinianas internas e externa', c:'descolamento de retina tracional'}
 ]},
 {id:'int', name:'Camadas internas da retina', normal:'Camadas internas da retina se encontram dentro da normalidade com padrão de estratificação preservado', f:[
  {id:'ed', l:'Cistos / edema macular', t:'Presença de cistos intra-retinianos compatíveis com edema macular', c:'edema macular{g}',
   g:[['Sem etiologia na conclusão','',''],['Diabético','',' diabético'],['Oclusão de veia central','',' secundário a oclusão de veia central da retina'],['Oclusão de ramo venoso','',' secundário a oclusão de ramo venoso da retina'],['Pós-operatório','',' cistoide pós-operatório'],['Uveítico','',' uveítico']],
   s:[['dsr','Com líquido sub-retiniano',' e lâmina de líquido subretiniano compatível com descolamento seroso de retina','']], sp:'', scp:''},
  {id:'cisf', l:'Cisto foveal isolado', t:'Presença de cisto intra-retiniano em região foveal', c:null},
  {id:'hrf', l:'Pontos hiperrefletivos', t:'Presença de pontos hiperrefletivos {g}', c:null,
   g:[['Exsudatos/hemorragias','que podem corresponder a exsudatos/hemorragias',''],['Com sombreamento (exsudatos)','com sombreamento posterior que podem corresponder a exsudatos','']]},
  {id:'deso', l:'Desorganização com atrofia', take:'4-6', sec2:1, t:'Evidencia-se desorganização das camadas internas e externa da retina com áreas de atrofia do EPR', c:'desorganização das camadas retinianas com atrofia do EPR'},
  {id:'dril', l:'DRIL', t:'Desorganização das camadas internas da retina (DRIL)', c:null},
  {id:'isq', l:'Isquemia interna', t:'Hiperrefletividade e espessamento das camadas internas da retina, sugestivos de isquemia retiniana interna', c:'isquemia retiniana interna'},
  {id:'pamm', l:'PAMM', t:'Faixa hiperrefletiva na camada nuclear interna, sugestiva de maculopatia média aguda paracentral (PAMM)', c:'maculopatia média aguda paracentral (PAMM)'},
  {id:'sq', l:'Retinosquise', t:'Separação entre as camadas da retina neurossensorial, compatível com retinosquise{g}', c:'retinosquise macular{g}',

/* Normaliza dados salvos: descarta achados inexistentes e corrige formatos */
function fixEye(e){
  const b=blankEye();if(!e||typeof e!=='object')return b;
  SECTIONS.forEach(sec=>{const src=(e.sel&&e.sel[sec.id])||{};
    sec.f.forEach(f=>{const v=src[f.id];if(!v||typeof v!=='object')return;
      const g=Number.isInteger(v.g)&&f.g&&v.g>=0&&v.g<f.g.length?v.g:0;
      const s=Array.isArray(v.s)&&f.s?v.s.filter(k=>f.s.some(x=>x[0]===k)):[];
      b.sel[sec.id][f.id]={g,s,n:typeof v.n==='string'?v.n:''};});
    b.outro[sec.id]=e.outro&&typeof e.outro[sec.id]==='string'?e.outro[sec.id]:'';});
  if(FOV.some(x=>x[0]===e.fov))b.fov=e.fov;
  if(typeof e.cst==='string')b.cst=e.cst;b.cstp=e.cstp===true;b.lim=e.lim===true;if(typeof e.ot==='string')b.ot=e.ot;

}

function phrase(f,v,kind){
  if(kind==='c'&&f.cg)return f.cg[v.g]||f.cg[0];
  let s=kind==='t'?f.t:f.c;if(s==null)return null;
  if(f.g){const o=f.g[v.g]||f.g[0];const ins=kind==='t'?o[1]:o[2];s=s.includes('{g}')?s.replace('{g}',ins):s+ins;}
  if(f.n){const n=num(v.n);const ins=n!==null?(kind==='t'?f.n.t.replace('{n}',Math.round(n)):f.n.c(n)):'';s=s.includes('{n}')?s.replace('{n}',ins):s+ins;}
  if(f.s){const a=f.s.filter(x=>v.s.includes(x[0])).map(x=>kind==='t'?x[2]:x[3]).filter(Boolean);
    if(a.length)s+=(kind==='t'?f.sp:f.scp)+a.join('');}
  return s.replace(/\s{2,}/g,' ').trim();
}
/* Achados marcados num olho, na ordem do catálogo */
function selF(eye){const r=[];SECTIONS.forEach(sec=>sec.f.forEach(f=>{const v=eye.sel[sec.id][f.id];if(v)r.push({sec,f,v});}));return r;}
/* Para contagem nos cartões: um rótulo por achado marcado + texto livre */
function secItems(eye,sec,kind){
  const out=selF(eye).filter(x=>x.sec===sec).map(x=>kind==='t'?(phrase(x.f,x.v,'t')||x.f.l):phrase(x.f,x.v,'c')).filter(Boolean);
  if(kind==='t'){const o=eye.outro[sec.id].trim();if(o)out.push(o);}
  return out;
}
function abnormal(eye){let n=selF(eye).length;SECTIONS.forEach(s=>{if(eye.outro[s.id].trim())n++;});if(eye.fov!=='presente')n++;if(eye.ot.trim())n++;if(eye.lim)n++;if(eye.cstp)n++;return n;}
const lc1=t=>/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-záéíóúâêôãõç]/.test(t)?t[0].toLowerCase()+t.slice(1):t;

/* Itens de um olho, no formato do serviço */
function eyeBlock(e){
  const eye=S.eyes[e],L=[],sel=selF(eye);
  const T=x=>phrase(x.f,x.v,'t');
  const push=t=>{t=String(t).trim().replace(/\.$/,'');if(t)L.push('• '+cap(t));};
  const outro=id=>{const o=eye.outro[id].trim().replace(/\.$/,'');return o?[o]:[];};
  const extras=()=>{eye.ot.trim().split('\n').map(x=>x.trim()).filter(Boolean).forEach(push);};
  if(eye.lim)push(LIM_TXT);
  const all=sel.filter(x=>x.f.take==='all');
  if(all.length){all.forEach(x=>push(T(x)));extras();return L;}
  /* 1. interface: um item; estado da hialoide primeiro, unido ao achado seguinte por "com" */
  const iv=sel.filter(x=>x.sec.id==='ivr'&&!x.f.own);
  const parts=iv.map(x=>T(x)).concat(outro('ivr'));
  if(!parts.length)push(SECTIONS[0].normal);
  else if(parts.length===1&&iv.length===1&&iv[0].f.alone)push(IVR+iv[0].f.alone);
  else{const first=parts[0],rest=parts.slice(1).map(lc1);
    push(IVR+first+(rest.length?((iv[0]&&iv[0].f.hial)?' com ':', ')+rest.join(', '):''));}
  sel.filter(x=>x.f.own).forEach(x=>push(T(x)));
  if(sel.some(x=>x.f.take==='2-6')){extras();return L;}
  /* 2 e 3. fóvea e espessura */
  push((FOV.find(x=>x[0]===eye.fov)||FOV[0])[2]);
  const c=num(eye.cst);push('Espessura central: '+(c!==null?Math.round(c):'___')+' µm'+(eye.cstp?' (Medida prejudicada devido a interferência)':''));
  /* 4 a 6 */
  const t46=sel.filter(x=>x.f.take==='4-6');
  if(t46.length){t46.forEach(x=>push(T(x)));['int','ext','epr'].forEach(id=>outro(id).forEach(push));extras();return L;}
  const of=(id,pred)=>sel.filter(x=>x.sec.id===id&&(!pred||pred(x))).map(T).filter(Boolean);
  const it=of('int').concat(outro('int'));(it.length?it:[SECTIONS[1].normal]).forEach(push);
  const m56=sel.filter(x=>x.f.m56||x.f.take==='5-6');
  const ex=of('ext',x=>x.f.take!=='5-6').concat(outro('ext'));
  const ep=of('epr',x=>!x.f.m56).concat(outro('epr'));
  if(m56.length){ex.forEach(push);m56.forEach(x=>push(T(x)));ep.forEach(push);}
  else{(ex.length?ex:[SECTIONS[2].normal]).forEach(push);(ep.length?ep:[SECTIONS[3].normal]).forEach(push);}
  extras();
  return L;
}
/* Conclusão: diagnósticos principais, agrupados por olho */
function eyeConcl(e){
  const sel=selF(S.eyes[e]).filter(x=>x.f.c!=null||x.f.cg);
  let p=sel.filter(x=>!x.f.sec2).map(x=>phrase(x.f,x.v,'c'));
  if(!p.length)p=sel.filter(x=>x.f.sec2).map(x=>phrase(x.f,x.v,'c'));
  return [...new Set(p.filter(Boolean))];
}
function autoConcl(){
  const eyes=examEyes(),per={};eyes.forEach(e=>per[e]=eyeConcl(e));
  if(eyes.every(e=>!per[e].length))return ['Exame dentro da normalidade'];
  const parts=[];
  if(eyes.length===2){
    const both=per.OD.filter(x=>per.OE.some(y=>y.toLowerCase()===x.toLowerCase()));
    const only=e=>per[e].filter(x=>!both.some(y=>y.toLowerCase()===x.toLowerCase()));
    if(both.length)parts.push(andJoin(both)+' em ambos os olhos');
    if(only('OD').length)parts.push(andJoin(only('OD'))+' em olho direito');
    if(only('OE').length)parts.push(andJoin(only('OE'))+' em olho esquerdo');
  }else parts.push(andJoin(per[eyes[0]])+(eyes[0]==='OD'?' em olho direito':' em olho esquerdo'));
  return ['Exame '+S.cterm+' '+andJoin(parts)];
}
/* Linhas do laudo: {t:texto, b:negrito, bul:item com marcador} */
function lines(){

  if(a.length){L.push({t:''});a.forEach(t=>L.push({t,b:1,sig:1}));}
  return L;
}

/* Lê como data URL (funciona também em visualizadores que bloqueiam blob:). PDFs viram uma imagem por página. */
const toDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLib=null;
/* pdf.js: a página roda num ambiente que não permite "worker" de outro domínio. Por isso o processador
   do PDF é carregado como script comum e roda na própria página, sem o aviso "fake worker". */
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});}
/* Silencia o aviso interno do pdf.js sobre o modo sem worker (não é erro; o PDF abre normalmente) */
(()=>{const quiet=a=>typeof a[0]==='string'&&/Setting up fake worker|worker has been disabled/i.test(a[0]);
  ['log','warn','info'].forEach(k=>{const o=console[k].bind(console);console[k]=(...a)=>{if(!quiet(a))o(...a);};});})();
function loadPdfJs(){
  if(pdfLib)return pdfLib;
  pdfLib=(async()=>{await loadScript(PDFJS+'pdf.min.js');await loadScript(PDFJS+'pdf.worker.min.js');
    const p=window.pdfjsLib;if(!p)throw new Error('pdf.js');p.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';return p;})();
  pdfLib.catch(()=>{pdfLib=null;});
  return pdfLib;
}
async function pdfPages(file){
  const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),verbosity:0,isEvalSupported:false}).promise;const out=[];
  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const v1=pg.getViewport({scale:1});
    const v=pg.getViewport({scale:Math.min(4,2400/Math.max(v1.width,v1.height))});
    let both=false,date='',eyeTag='',map=false;try{const tx=(await pg.getTextContent()).items.map(t=>t.str).join(' ');map=/MAP\s*X-Y/i.test(tx);both=/\bBOTH\b|Eye\s*:\s*Both/i.test(tx);
      const m=tx.match(/(\d{1,2})\/(\d{1,2})\/(20\d{2})\s*,\s*(BOTH|OD|OS)\s*,/);
      if(m){date=String(m[2]).padStart(2,'0')+'/'+String(m[1]).padStart(2,'0')+'/'+m[3];eyeTag=m[4];}
      else{const d=tx.match(/Data do exame:\s*(\d{2}\/\d{2}\/\d{4})/);if(d)date=d[1];}}catch(x){}
    const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:v}).promise;
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));if(blob)out.push({blob,both,date,eyeTag,map,name:file.name.replace(/\.pdf$/i,'')+' · pág. '+i});}
  return out;
}
async function addFiles(files){
  const e=S.eye,arr=[...files];
  const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
  const isImg=f=>f.type.startsWith('image/')||/\.(jpe?g|png|gif|webp|bmp|heic|heif|tiff?)$/i.test(f.name);
  const ok=arr.filter(f=>isPdf(f)||isImg(f));
  if(!ok.length){toast('Nenhuma imagem ou PDF reconhecido');return;}
  for(const f of ok){
    if(isPdf(f)){toast('Abrindo o PDF…');
      try{const pages=await pdfPages(f);for(const p of pages)IMGS[e].push({url:await toDataURL(p.blob),name:p.name,blob:p.blob,both:p.both,map:p.map,eyeTag:p.eyeTag});
        /* Data e olhos tirados do próprio PDF (o Nidek usa mês/dia/ano no rodapé) */
        const dates=pages.map(p=>p.date).filter(Boolean),tags=pages.map(p=>p.eyeTag).filter(Boolean);
        if(!S.data.trim()&&dates.length){const cnt={};dates.forEach(d=>cnt[d]=(cnt[d]||0)+1);S.data=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];$('data').value=S.data;
          if(Object.keys(cnt).length>1)toast('O PDF tem páginas com datas diferentes');}
        if(tags.length&&S.txt===null){const o=tags.includes('BOTH')||(tags.includes('OD')&&tags.includes('OS'))?'AO':tags[0]==='OD'?'OD':'OE';if(o!=='AO'&&e!==o){IMGS[o]=IMGS[o].concat(IMGS[e]);IMGS[e]=[];}if(o!==S.olhos){S.olhos=o;$('olhos').value=o;setEye(S.eye);}}
        update();}
      catch(x){toast('Não foi possível abrir o PDF. Envie as páginas como imagem.');}}
    else{try{IMGS[e].push({url:await toDataURL(f),name:f.name,blob:f});}catch(x){toast('Não foi possível ler '+f.name);}}
    renderImg();
  }
}

/* Guia do serviço (guia-laudo-oct.md), condensado para a leitura automática */
const GUIDE=`MODELO DO SERVIÇO (itens sem ponto final; olhos por extenso)
Para cada olho examinado, seis itens nesta ordem:
1. Interface vítreo-retiniana: Sem alterações
2. Depressão foveal presente
3. Espessura central: N µm
4. Camadas internas da retina se encontram dentro da normalidade com padrão de estratificação preservado
5. Retina neurossensorial sem alterações
6. Complexo EPR-Coroide sem alterações
Estrutura normal: copie a frase acima literalmente. Estrutura alterada: troque só aquele item pela frase da biblioteca.

BIBLIOTECA DE FRASES (use exatamente estas quando o achado couber)
Item 1, sempre com o prefixo "Interface vítreo-retiniana: " e todos os achados da interface no mesmo item:
- hialoide posterior parcialmente aderida
- Sem alterações com hialoide aderida
- hialoide posterior descolada (use quando relevante, por exemplo com buraco macular; hialoide totalmente descolada e afastada, sem tração, sai como "Sem alterações")
- Não visualizo hialoide posterior
- Hiperrefletividade linear pré retiniana compatível com membrana epirretiniana (sutil: "pré retiniana discreta" ou "pré retiniana tênue")
- hialoide parcialmente aderida com hiperrefletividade linear pré retiniana tênue compatível com membrana epirretiniana
- adesão vítrea persistente na região macular, com tração sobre a superfície retiniana e alteração do contorno foveal (tração vitreomacular)
- Presença de pontos hiperrefletivos entre a hialoide e a retina sugestivo de hemorragia subhialoidea
- linha hiperrefletiva sugestiva de óleo de silicone em cavidade vítrea
Item 2: Depressão foveal presente | Depressão foveal alterada | Depressão foveal irregular | Depressão foveal ausente | Perda da depressão foveal | Exame com perda de centralização em região foveal (exame descentrado, alta miopia)
Item 3: Espessura central: N µm. Se a segmentação falhou e o valor contradiz o B-scan (por exemplo, valor baixo num olho com edema): "Espessura central: N µm (Medida prejudicada devido a interferência)". Sem mapa ETDRS: "Espessura central: ___ µm".
Item 4 (um item por achado):
- Presença de cistos intra-retinianos compatíveis com edema macular
- Presença de cistos intra-retinianos compatíveis com edema macular e lâmina de líquido subretiniano compatível com descolamento seroso de retina
- Presença de cisto intra-retiniano em região foveal
- Presença de pontos hiperrefletivos que podem corresponder a exsudatos/hemorragias
- Presença de pontos hiperrefletivos com sombreamento posterior que podem corresponder a exsudatos
Itens 5 e 6: achados da linha fotorreceptores-EPR ocupam UM item no lugar dos itens 5 e 6 (o olho fica com 5 itens):
- O segmento externo dos fotorreceptores-EPR apresenta-se irregular na região da mácula o que sugere drusas
- Discreta irregularidade a nível de segmento externo dos fotorreceptores-EPR o que sugere drusas
- O segmento externo dos fotorreceptores-EPR apresenta-se irregular na região da mácula com áreas de atrofia do EPR (acrescente "e retina externa" se houver perda da retina externa)
- Irregularidade na linha de fotorreceptores-EPR em região foveal associado a hiperrefletividade subretiniana compatível com membrana neovascular subretiniana; com atividade: acrescente "com presença de material hiporrefletivo subretiniano sugestivo de atividade de membrana" ou "apresentando líquido subretiniano"; cicatricial: "de aspecto cicatricial com áreas de atrofia do EPR"
- Impraticável avaliação de retina externa e EPR devido a interferência de sinal (sombra de cistos ou hemorragia impede a avaliação)
- Líquido sub-retiniano sem edema intrarretiniano (item 5): Presença de líquido subretiniano compatível com descolamento seroso de retina
Achados que substituem vários itens:
- Buraco macular de espessura total (substitui os itens 2 a 6): Presença de buraco macular de espessura total, com descontinuidade completa da retina neurossensorial na fóvea medindo cerca de N µm. Bordos do buraco apresentam cistos intrarretinianos com bordos elevados (inclua a medida só se houver medida na imagem)
- Descolamento tracional (substitui todos os itens): Hialoide aderida com tração vítreo retiniana em vários pontos causando perda da depressão foveal e desorganização completa das camadas retinianas internas e externa
- Desorganização com atrofia (substitui os itens 4 a 6): Evidencia-se desorganização das camadas internas e externa da retina com áreas de atrofia do EPR
- Exame sem condição de avaliação: primeiro item "Exame de difícil avaliação devido interferências do sinal e má centralização", depois o achado principal visível (por exemplo "Apresenta áreas de afinamento retiniano com áreas de atrofia do EPR difusas podendo corresponder a quadro de degeneração miópica")

CONCLUSÃO (uma frase, sem ponto final)
- Entram só os diagnósticos principais: membrana epirretiniana, tração vitreomacular, edema macular, membrana neovascular (em atividade ou cicatriz disciforme), drusas maculares, atrofia (quando é o achado principal), buraco macular, descolamento de retina tracional, degeneração miópica.
- Não entram: hialoide aderida ou parcialmente aderida, pontos hiperrefletivos isolados, cisto foveal isolado. Exame só com esses achados: "Exame dentro da normalidade".
- Padrões: "Exame dentro da normalidade" | "Exame compatível com membrana epirretiniana e edema macular em ambos os olhos" | "Exame sugestivo de edema macular bilateral" | "Exame sugestivo de cicatriz disciforme em olho direito e membrana neovascular em atividade em olho esquerdo" | "Exame compatível com buraco macular de espessura total em olho direito" | "Exame sugere quadro de retinopatia diabética" | "Exame sugestivo de edema macular secundário a oclusão de veia central da retina em olho direito" | "Exame compatível com drusas maculares em ambos os olhos" | "Exame compatível com degeneração miópica em ambos os olhos".
- "compatível com" para achado típico; "sugestivo de" quando há inferência (etiologia, atividade, qualidade ruim). Etiologia (retinopatia diabética, oclusão venosa, degeneração miópica) só quando o padrão for claro, e registre na conferência que precisa de confirmação clínica.

LEITURA DO EXAME (Nidek RS-3000)
- Espessura central = número do círculo central (1 mm) do ETDRS 9 Sector, na página MACULA MAP X-Y (mapa ILM–RPE/BM). AS CORES DO BANCO NORMATIVO NÃO ENTRAM NO LAUDO: exames normais costumam ter o anel interno vermelho ou amarelo.
- Datas do aparelho estão em mês/dia/ano (4/11/2026 = 11/04/2026). Escreva a data como dd/mm/aaaa.
- Qualidade: SQI (x/5), SSI (x/10) e "Tracing HD (n/50)"; n baixo (1/50) = imagem ruidosa, sem promediação.
- Página "Eye:Both": olho direito (R) à esquerda, olho esquerdo (L) à direita. Página de um olho só ("OD" ou "OS" no rodapé): o exame é desse olho; o outro fica null.
- Sombreamento x atrofia: exsudatos, hemorragias e focos hiperrefletivos causam sombra posterior; isso não é atrofia. Atrofia exige hipertransmissão para a coroide com perda do EPR e afinamento da retina externa, sem foco acima explicando o sinal.
- Avalie todos os B-scans (CROSS, LINE, RADIAL, MULTI CROSS) antes de decidir que uma estrutura é normal. Descreva alterações sutis, desde que visíveis.`;

${EXAMPLES}

COMO RESPONDER
1. Primeiro preencha "analise": para cada olho e estrutura, uma frase curta do que você vê nos B-scans (e em qual imagem), sem partir do pressuposto de normalidade. EPR e coroide merecem atenção especial.
2. Depois escreva os itens de cada olho com as frases do modelo e da biblioteca. Use a frase normal só se a análise da estrutura não encontrou alteração.
3. "paciente": nome do cabeçalho em ordem direta (o aparelho mostra SOBRENOME NOME), em maiúsculas. "data": data do exame em dd/mm/aaaa, ou "".
4. "conferencia": 2 a 6 itens curtos para o laudador conferir (não entram no laudo): qualidade (SQI, SSI, n/50) de cada olho, segmentação com falha, achados duvidosos, etiologia inferida, datas diferentes entre páginas.
5. Olho que não aparece em nenhuma imagem: null na lista e na análise.

Responda com apenas um objeto JSON, sem texto antes ou depois:
{"paciente": "", "data": "", "analise": {"OD": {"interface": "", "fovea": "", "espessura": "", "camadas_internas": "", "retina_externa": "", "epr_coroide": ""}, "OE": {"interface": "", "fovea": "", "espessura": "", "camadas_internas": "", "retina_externa": "", "epr_coroide": ""}}, "OD": ["itens"], "OE": ["itens"], "conclusao": "", "conferencia": []}`;
}
const clean=t=>String(t).trim().replace(/^[•\-–*]\s*/,'').replace(/\.$/,'').trim();
/* Monta o texto final: conteúdo da análise no layout do modelo + encerramento e assinatura da página */
function aiCompose(r){
  if(!r||typeof r!=='object'||Array.isArray(r))throw {code:'invalid_json'};
  const notes=Array.isArray(r.conferencia)?r.conferencia.map(clean).filter(Boolean).slice(0,8):[];
  if(!S.pac.trim()&&typeof r.paciente==='string'&&r.paciente.trim()){S.pac=r.paciente.trim().toUpperCase();$('pac').value=S.pac;}
  if(!S.data.trim()&&typeof r.data==='string'&&/^\d{2}\/\d{2}\/\d{4}$/.test(r.data.trim())){S.data=r.data.trim();$('data').value=S.data;}
  const name=S.pac.trim().toUpperCase();
  const L=['TOMOGRAFIA DE COERÊNCIA ÓPTICA DE MÁCULA','','PACIENTE : '+name];
  if(S.data.trim())L.push('DATA: '+S.data.trim());
  L.push('');
  const has=e=>Array.isArray(r[e])&&r[e].some(x=>clean(x));
  if(has('OD')!==has('OE')){S.olhos=has('OD')?'OD':'OE';$('olhos').value=S.olhos;}
  let any=false;
  ['OD','OE'].forEach(e=>{
    const it=Array.isArray(r[e])?r[e].map(clean).filter(Boolean):null;
    if(it&&it.length){any=true;L.push(EYE_NAME[e]);it.forEach(t=>L.push('• '+t));L.push('');}
    else notes.push(EYE_NAME[e]+': não incluído nas imagens; omitido do laudo.');});
  if(!any)throw {code:'empty_completion'};
  const cc=clean(r.conclusao||'');
  L.push('Conclusão','',cc||'___');
  if(/difícil avaliação/i.test(L.join(' ')))L.push('',LIM_END);
  ENC.split('\n').map(x=>x.trim()).filter(Boolean).forEach(t=>L.push('',t));
  const a=ASS.split('\n').map(x=>x.trim()).filter(Boolean);if(a.length){L.push('');a.forEach(t=>L.push(t));}
  const ANA_K=[['interface','Interface'],['fovea','Fóvea'],['espessura','Espessura'],['camadas_internas','Camadas internas'],['retina_externa','Retina externa'],['epr_coroide','EPR e coroide']];
  const ana={};const src=r.analise&&typeof r.analise==='object'?r.analise:{};
  ['OD','OE'].forEach(e=>{const x=src[e];if(!x||typeof x!=='object')return;
    const rows=ANA_K.map(([k,l])=>[l,typeof x[k]==='string'?clean(x[k]):'']).filter(r=>r[1]);if(rows.length)ana[e]=rows;});
  return {txt:L.join('\n'),notes,ana};
}
const IS_BOLD=t=>t==='TOMOGRAFIA DE COERÊNCIA ÓPTICA DE MÁCULA'||/^PACIENTE\s*:/.test(t)||/^DATA\s*:/.test(t)||t==='Olho direito'||t==='Olho esquerdo'||t==='Conclusão'||ASS.split('\n').map(x=>x.trim()).filter(Boolean).includes(t);
function fmtHTML(txt){
  return txt.split('\n').map(t=>{
    if(!t.trim())return `<p style="${P}">&nbsp;</p>`;
    const st=P+(t.startsWith('• ')?'padding-left:0.9em;text-indent:-0.9em;':'');
    return IS_BOLD(t.trim())?`<p style="${st}text-align:left;"><b>${esc(t)}</b></p>`:`<p style="${st}">${esc(t).replace(/^• /,'•&nbsp;')}</p>`;
  }).join('');
}
/* Texto do laudo editado: uma linha por parágrafo (innerText do bloco inteiro duplicaria as quebras) */
function sheetText(){const out=[];
  $('out').childNodes.forEach(n=>{const t=(n.nodeType===3?n.textContent:(n.innerText||'')).replace(/ /g,' ');t.split('\n').forEach(x=>out.push(x.trimEnd()));});
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();}
let editT;
$('out').addEventListener('input',()=>{clearTimeout(editT);editT=setTimeout(()=>{
  if(S.txt===null)S.src='manual';S.txt=sheetText();renderOut();save();},300);});
let backArm=null;
$('modeBack').addEventListener('click',ev=>{const b=ev.currentTarget;
  if(!backArm){b.textContent=S.src==='ai'?'Descartar a leitura?':'Descartar as edições?';b.classList.add('warn');backArm=setTimeout(()=>{backArm=null;b.textContent='Voltar ao formulário';b.classList.remove('warn');},3500);return;}
  clearTimeout(backArm);backArm=null;b.textContent='Voltar ao formulário';b.classList.remove('warn');
  S.txt=null;S.src='';S.notes=[];S.ana={};AI.msg='';update();renderImg();toast('Laudo de volta ao formulário');});
function aiErr(e){
  const c=e&&e.code;
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'].includes(c)){SAMPLE=null;return '';}
  return ({cancelled:'Leitura interrompida.',rate_limited:'Limite de uso do Claude atingido. Tente novamente mais tarde.',
    image_rejected:'Uma das imagens não foi aceita (formato ou tamanho). Use JPG ou PNG.',session_expired:'Sessão expirada. Entre novamente no Claude.',
    invalid_json:'A resposta não veio no formato esperado. Toque em Ler imagem para tentar de novo.',refused:'A leitura foi recusada para estas imagens.',
    prompt_too_large:'Imagens demais para uma leitura. Remova algumas e tente de novo.',empty_completion:'A leitura não trouxe resultado. Tente de novo.'})[c]||'Falha na leitura. Tente novamente.';
}
/* Divide uma página com os dois olhos em duas imagens (esquerda = olho direito, direita = olho esquerdo) */
async function cropHalves(blob){
  const bmp=await createImageBitmap(blob);const w=bmp.width,h=bmp.height,m=Math.round(w/2);
  const part=(x,cw)=>new Promise(res=>{const c=document.createElement('canvas');c.width=cw;c.height=h;
    const ctx=c.getContext('2d');ctx.drawImage(bmp,x,0,cw,h,0,0,cw,h);c.toBlob(b=>b?res(b):res(null),'image/jpeg',0.92);});
  const l=await part(0,m),r=await part(m,w-m);if(bmp.close)bmp.close();
  if(!l||!r)throw new Error('crop');return [l,r];
}
/* Recorte ampliado do ETDRS 9 Sector na página MACULA MAP X-Y (posições do layout do Nidek RS-3000) */
async function cropRegion(blob,[x0,y0,x1,y1],scale){
  const bmp=await createImageBitmap(blob);const w=bmp.width,h=bmp.height;
  const sx=Math.round(w*x0),sy=Math.round(h*y0),sw=Math.round(w*(x1-x0)),sh=Math.round(h*(y1-y0));
  const c=document.createElement('canvas');c.width=Math.round(sw*scale);c.height=Math.round(sh*scale);
  const ctx=c.getContext('2d');ctx.imageSmoothingQuality='high';ctx.drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);if(bmp.close)bmp.close();
  return await new Promise(r=>c.toBlob(r,'image/png'));
}
async function etdrsCrops(src){
  const out=[];
  for(const x of src){if(!x.map)continue;
    try{
      if(x.both||x.eyeTag==='BOTH'){
        out.push({eye:'OD',blob:await cropRegion(x.blob,[.29,.27,.50,.545],2.2)});
        out.push({eye:'OE',blob:await cropRegion(x.blob,[.50,.27,.71,.545],2.2)});
      }else if(x.eyeTag==='OD'||x.eyeTag==='OS'){
        out.push({eye:x.eyeTag==='OD'?'OD':'OE',blob:await cropRegion(x.blob,[.33,.23,.51,.49],2.2)});
      }
    }catch(e){}
    if(out.length)break;
  }
  return out.filter(c=>c.blob);
}
/* Leitura só dos números centrais: tarefa simples, mais confiável que dentro da leitura geral */
async function readThickness(crops,signal){
  if(!crops.length)return {};
  const p=`Cada imagem é o gráfico "ETDRS 9 Sector" de uma OCT de mácula (Nidek RS-3000): um círculo dividido em 9 setores com a espessura em µm. Leia o número do CÍRCULO CENTRAL (o menor círculo, no meio) de cada imagem. Ignore as cores e a escala lateral (100, 99, 95, 5, 1, 0).
${crops.map((c,i)=>`Imagem ${i+1}: ${c.eye==='OD'?'olho direito':'olho esquerdo'}`).join('\n')}
Responda só com JSON: {"OD": número ou null, "OE": número ou null}. Use null se o número não estiver legível.`;
  try{const r=await SAMPLE.json(p,{images:crops.map(c=>c.blob),modelTier:'default',signal});return r&&typeof r==='object'?r:{};}catch(e){return {};}
}
/* Aplica o valor do ETDRS no item de espessura de cada olho, mantendo "(Medida prejudicada…)" se houver */
function applyThickness(r,th,notes){
  ['OD','OE'].forEach(e=>{const n=num(th[e]);if(n===null||!Array.isArray(r[e]))return;const v=Math.round(n);
    let i=r[e].findIndex(t=>/^\W*Espessura central/i.test(String(t)));
    if(i<0){/* item ausente: entra logo após o da depressão foveal (não em buraco macular ou tração) */
      const j=r[e].findIndex(t=>/depressão foveal|perda de centralização/i.test(String(t)));
      if(j<0)return;r[e].splice(j+1,0,'Espessura central: ___ µm');i=j+1;}
    const old=String(r[e][i]),prev=old.match(/(\d{2,4})\s*µ?m/),suf=(old.match(/\(Medida prejudicada[^)]*\)/i)||[''])[0];
    r[e][i]='Espessura central: '+v+' µm'+(suf?' '+suf:'');
    if(prev&&+prev[1]!==v)notes.push(EYE_NAME[e]+': espessura central conferida no ETDRS ('+v+' µm); a leitura geral tinha indicado '+prev[1]+' µm.');
    S.eyes[e].cst=String(v);});
}
async function readImages(){
  if(AI.busy||!SAMPLE)return;
  const src=[...IMGS.OD,...IMGS.OE].filter(x=>x.blob);
  if(!src.length)return;
  AI.busy=true;AI.err=false;AI.msg='Preparando as imagens…';renderImg();
  const prim=[],extra=[];
  for(const x of src){
    if(x.both){try{const [l,r]=await cropHalves(x.blob);
      prim.push({blob:l,desc:`"${x.name}", metade esquerda da página: olho direito (R)`},{blob:r,desc:`"${x.name}", metade direita da página: olho esquerdo (L)`});
      extra.push({blob:x.blob,desc:`"${x.name}", página inteira (cabeçalho, índices de qualidade e contexto)`});continue;}catch(e){}}
    prim.push({blob:x.blob,desc:`"${x.name}"`});
  }
  const crops=await etdrsCrops(src);
  crops.forEach(c=>prim.unshift({blob:c.blob,desc:`mapa ETDRS ampliado do ${c.eye==='OD'?'olho direito':'olho esquerdo'}: o número do círculo central é a espessura central`}));
  if(crops.length===2)[prim[0],prim[1]]=[prim[1],prim[0]];
  const max=IMG_LIM?IMG_LIM.maxCount:prim.length+extra.length;
  let list=prim.slice(0,max);const cut=Math.max(0,prim.length-max);
  list=list.concat(extra.slice(0,Math.max(0,max-list.length)));
  AI.msg='Analisando '+list.length+(list.length>1?' imagens':' imagem')+'. Pode levar 1 a 2 minutos.';renderImg();
  aiCtl=new AbortController();let done=false;
  try{
    const [r,th]=await Promise.all([SAMPLE.json(buildPrompt(list),{images:list.map(x=>x.blob),modelTier:'complex',signal:aiCtl.signal}),readThickness(crops,aiCtl.signal)]);
    const thNotes=[];if(r&&typeof r==='object')applyThickness(r,th,thNotes);
    {const c=aiCompose(r);S.txt=c.txt;S.src='ai';S.notes=c.notes.concat(thNotes);S.ana=c.ana;}save();done=true;
    AI.msg='Laudo preenchido com a leitura das imagens.'+(cut?' '+cut+(cut>1?' imagens ficaram':' imagem ficou')+' de fora (limite de '+max+' por leitura).':'');
  }catch(e){AI.msg=aiErr(e);AI.err=!!(e&&e.code!=='cancelled');}
  finally{AI.busy=false;aiCtl=null;renderImg();update();
    if(done){toast('Laudo preenchido');if(matchMedia('(max-width:900px)').matches)document.querySelector('.preview').scrollIntoView({behavior:'smooth',block:'start'});}}
}

let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800);}
function copyRich(txt,body,el){
  const html=`<html><head><meta charset="utf-8"><style>html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}body,p,b{font-family:Arial,Helvetica,sans-serif;font-size:12pt}</style></head><body style="${P}">${body}</body></html>`;
  const legacy=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);let ok=false;try{ok=document.execCommand('copy');}catch(e){}
    if(ok){s.removeAllRanges();toast('Laudo copiado');}else toast('Texto selecionado, use Copiar do sistema');};
  try{if(navigator.clipboard&&window.ClipboardItem){
      const item=new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})});
      navigator.clipboard.write([item]).then(()=>toast('Laudo copiado'),legacy);return;}}catch(e){}
  legacy();
}
function copyPlainText(txt){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();toast(ok?'Texto simples copiado':'Não foi possível copiar');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Texto simples copiado'),fb);else fb();
}
/* Copia o que está no quadro do laudo, inclusive edições ainda não salvas */
function current(){
  if(S.txt===null&&document.activeElement===$('out')){S.txt=sheetText();S.src='manual';save();}
  else if(S.txt!==null){S.txt=sheetText();save();}
  return S.txt===null?{txt:report(),html:reportHTML()}:{txt:S.txt,html:fmtHTML(S.txt)};
}
const copy=()=>{const c=current();copyRich(c.txt,c.html,$('out'));};
